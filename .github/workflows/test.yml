name: Test

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          run_install: true

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          # fs-fixture defaults to os.tmpdir() (C: drive on GH runners),
          # but the repo checkout is on D: drive. path.relative() cannot
          # compute relative paths across drives, breaking CSS module
          # hash generation. Setting TEMP to the same drive fixes this.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
